name: Build

on:
  push:
    branches: '*'
  pull_request:
    branches: '*'
  workflow_dispatch:
    inputs:
      SIGN_WINDOWS_INSTALLER:
        description: 'Sign Windows Installer'
        required: true
        type: boolean
        default: false

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  CMAKE_OPTIONS: -Dtests=ON -Dsymbols=ON -Ddisplay-install-paths=ON -Dtest-lto=OFF -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache


jobs:

  fetch_build_number:
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.fetch.outputs.build_number }}
    steps:
      - uses: actions/checkout@v6
        with:
            fetch-depth: 1
      - id: fetch
        shell: bash
        run: |
          build_version="$("${{ github.workspace }}/scripts/mumble-version.py")"
          build_number="$("${{ github.workspace }}/scripts/mumble-build-number.py" \
            --commit "${{ github.sha }}" --version "${build_version}" \
            --password "${{ secrets.BUILD_NUMBER_TOKEN }}" --default 0)"
          echo "Build Number: ${build_version}.${build_number}"
          echo "build_number=${build_number}" >> "$GITHUB_OUTPUT"


  build:
    needs: [ fetch_build_number ]

    strategy:
        fail-fast: false
        matrix:
            os: [ubuntu-22.04, ubuntu-24.04, windows-2025-vs2026, macos-14]
            type: [static, shared]
            arch: [x86_64]
            exclude:
              - os: windows-2025-vs2026
                type: shared
              - os: macos-14
                type: shared
              - os: ubuntu-22.04
                type: static

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v6
      with:
          submodules: 'recursive'
          fetch-depth: 1


      # The Bash version installed on macOS is ancient. We need a newer version
    - name: Install Bash
      if: startswith(matrix.os, 'macos')
      run: brew install bash

    - name: Set environment variables
      run: $GITHUB_WORKSPACE/.github/workflows/set_environment_variables.sh "${{ matrix.os }}" "${{ matrix.type }}" "${{ matrix.arch }}" "${{ github.workspace }}"
      shell: bash

    - uses: actions/cache/restore@v5
      with:
          path: '${{ env.MUMBLE_ENVIRONMENT_DIR }}'
          key: ${{ env.MUMBLE_ENVIRONMENT_VERSION }}

    - uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ github.base_ref || github.ref_name }}.${{ matrix.os }}.${{ matrix.type }}
        save: ${{ github.event_name != 'pull_request' }}
        append-timestamp: false
        update-package-index: true

    - uses: ./.github/actions/install-dependencies
      with:
          type: ${{ matrix.type }}
          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}

    - name: Build
      run: ./.github/workflows/build.sh "${{ matrix.os }}" "${{ matrix.type }}" "${{ matrix.arch }}"
      shell: bash
      env:
          MUMBLE_BUILD_NUMBER: ${{ needs.fetch_build_number.outputs.build_number }}

    - name: Test
      working-directory: ${{ github.workspace }}/build
      shell: bash
      # continue-on-error for local act runs where DB services aren't available
      continue-on-error: ${{ env.ACT == 'true' }}
      run: ctest --output-on-failure -C $BUILD_TYPE

    - if: ${{ inputs.SIGN_WINDOWS_INSTALLER && startsWith(matrix.os, 'windows') }}
      uses: ./.github/actions/sign-binaries
      with:
          signpath-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          build-number: ${{ needs.fetch_build_number.outputs.build_number }}
          type: ${{ matrix.type }}
          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}

    # ---- Windows static: portable ZIP (no installer) ----

    - name: Bundle Windows portable
      if: ${{ startsWith(matrix.os, 'windows') && matrix.type == 'static' }}
      shell: bash
      run: |
        mkdir -p portable/plugins portable/licenses

        # Core binaries
        cp build/mumble.exe portable/
        cp build/speexdsp.dll portable/

        # Optional binaries (copy if they exist)
        for f in rnnoise.dll mumble_ol.dll mumble_ol_x64.dll mumble_ol_helper.exe mumble_ol_helper_x64.exe mumble-g15-helper.exe; do
          [ -f "build/$f" ] && cp "build/$f" portable/
        done

        # Positional audio plugins
        cp build/plugins/*.dll portable/plugins/ 2>/dev/null || true

        # License files
        cp build/licenses/* portable/licenses/ 2>/dev/null || true

        # Create ZIP
        cd portable
        7z a -tzip ../mumble-windows-x86_64-portable.zip .
        cd ..

        echo "=== Portable ZIP contents ==="
        7z l mumble-windows-x86_64-portable.zip

    - name: Upload Windows portable
      if: ${{ startsWith(matrix.os, 'windows') && matrix.type == 'static' && env.ACT != 'true' }}
      uses: actions/upload-artifact@v6
      with:
        name: 'Mumble-windows-portable'
        compression-level: 9
        path: mumble-windows-x86_64-portable.zip

    # ---- Linux shared: bundle with linuxdeploy ----

    - name: Bundle Linux client with linuxdeploy
      if: ${{ startsWith(matrix.os, 'ubuntu') && matrix.type == 'shared' }}
      shell: bash
      run: |
        # Download linuxdeploy + Qt plugin and extract (FUSE unavailable in Docker)
        wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
        wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
        chmod +x linuxdeploy*.AppImage

        # Extract both AppImages so they can run without FUSE
        ./linuxdeploy-x86_64.AppImage --appimage-extract
        mv squashfs-root linuxdeploy-squashfs
        ./linuxdeploy-plugin-qt-x86_64.AppImage --appimage-extract
        mv squashfs-root linuxdeploy-plugin-qt-squashfs

        # Remove original AppImages so linuxdeploy doesn't try to execute them
        rm -f linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

        # Make the Qt plugin discoverable by linuxdeploy via PATH
        # linuxdeploy looks for "linuxdeploy-plugin-qt" in PATH
        ln -sf "$PWD/linuxdeploy-plugin-qt-squashfs/usr/bin/linuxdeploy-plugin-qt" "$PWD/linuxdeploy-squashfs/usr/bin/linuxdeploy-plugin-qt"
        export PATH="$PWD/linuxdeploy-squashfs/usr/bin:$PATH"

        # Create AppDir structure
        mkdir -p AppDir/usr/bin
        cp build/mumble AppDir/usr/bin/

        # Use the .desktop file generated by the build
        mkdir -p AppDir/usr/share/applications
        cp build/auxiliary_files/info.mumble.Mumble.desktop AppDir/usr/share/applications/mumble.desktop

        # Use the real icon from the source tree
        mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps
        cp icons/mumble.svg AppDir/usr/share/icons/hicolor/scalable/apps/mumble.svg

        # Run linuxdeploy to collect shared libs + Qt plugins
        export QMAKE=$(which qmake6 2>/dev/null || which qmake 2>/dev/null || echo "")
        ./linuxdeploy-squashfs/usr/bin/linuxdeploy \
          --appdir AppDir \
          --plugin qt \
          --executable build/mumble \
          --desktop-file AppDir/usr/share/applications/mumble.desktop \
          --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/mumble.svg

        # Copy Qt platform plugins not auto-bundled by linuxdeploy
        # - offscreen: required for headless operation (-platform offscreen)
        # - wayland: native Wayland support when GUI is shown
        for plugin in libqoffscreen.so libqwayland*.so; do
          for src in $(find /usr -name "$plugin" -path '*/platforms/*' 2>/dev/null); do
            cp "$src" AppDir/usr/plugins/platforms/
            echo "Bundled $(basename $src) from $src"
          done
        done
        # offscreen is required — fail if missing
        if [ ! -f AppDir/usr/plugins/platforms/libqoffscreen.so ]; then
          echo "ERROR: libqoffscreen.so not found on system" && exit 1
        fi

        # Package AppDir contents as a tarball (not an AppImage)
        # Strip the AppDir/usr/ prefix so the tarball extracts to bin/, lib/, plugins/
        tar czf mumble-linux-x86_64.tar.gz -C AppDir/usr .

        echo "=== Tarball path ==="
        readlink -f mumble-linux-x86_64.tar.gz

        echo "=== Tarball contents ==="
        tar tzf mumble-linux-x86_64.tar.gz | head -30 || true

        echo "=== Verifying mumble binary exists ==="
        tar tzf mumble-linux-x86_64.tar.gz | grep bin/mumble || true

    - name: Upload Linux bundle
      if: ${{ startsWith(matrix.os, 'ubuntu') && matrix.type == 'shared' && env.ACT != 'true' }}
      uses: actions/upload-artifact@v6
      with:
        name: 'Mumble-linux-bundle-${{ matrix.os }}'
        compression-level: 9
        path: mumble-linux-x86_64.tar.gz

    # ---- Static builds: publish as before ----

    - if: ${{ !inputs.SIGN_WINDOWS_INSTALLER && matrix.type == 'static' }}
      name: Publish
      uses: actions/upload-artifact@v6
      with:
        name: 'Mumble-${{ matrix.os }}'
        compression-level: 9
        path: |
          build/mumble
          build/mumble-server
          build/**/mumble*.msi
          build/**/mumble*.exe

      # We don't want to save the build env in a cache on a PR as caches are scoped
      # to branches and while PRs can access caches from the default branch, they
      # can't access the cache of other PRs. Hence, it is kind of a waste to save
      # the cache on a PR
    - if: ${{ matrix.type  == 'static' && github.event_name != 'pull_request' }}
      uses: actions/cache/save@v5
      with:
          path: '${{ env.MUMBLE_ENVIRONMENT_DIR }}'
          key: ${{ env.MUMBLE_ENVIRONMENT_VERSION }}
